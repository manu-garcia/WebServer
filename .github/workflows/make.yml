name: C/C++ Make CI

on:
  push:
      branches: [ "master" ]
  pull_request:
      branches: [ "master" ]

jobs:
  build:

      runs-on: ubuntu-latest

      steps:

      - uses: actions/checkout@v3

      - name: Print environment variables
        run: printenv

      - name: Build application (sanitize)
        env:
          CC: clang
        run: make san

      - name: Cleans sanitize
        run: make fclean

      - name: Build application
        env:
          CC: clang
        run: make
